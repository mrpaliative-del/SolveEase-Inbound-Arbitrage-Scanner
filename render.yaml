
services:
  - type: web
    name: solveease-inbound-arbitrage-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"

      - key: DATABASE_PATH
        value: data/inbound_arbitrage.db

      - key: INFERENCE_PROVIDER_API_KEY
        sync: false

      - key: INFERENCE_PROVIDER_BASE_URL
        sync: false

      - key: INFERENCE_TARGET_MODEL
        value: gpt-4o-mini

      - key: CORS_ORIGINS
        sync: false

      - key: DAILY_REQUEST_LIMIT
        value: "100"

      - key: PER_CLIENT_PER_MINUTE
        value: "5"
