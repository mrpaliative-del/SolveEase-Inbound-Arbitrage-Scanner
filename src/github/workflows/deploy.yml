
name: SolveEase CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: solveease-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python Source
        run: python -m compileall -q src

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No tests directory found."
          fi

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: validate

    # Never deploy pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --output /dev/null \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment trigger accepted."
